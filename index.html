<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBC Fee Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"><\/script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal-deep:  #0D5C63; --teal-mid:   #1A7F89; --teal-light: #E6F4F5;
    --amber:      #E8A020; --amber-light:#FEF3DC; --amber-deep: #946814;
    --red:        #C0392B; --red-light:  #FDEDEC;
    --green:      #1E8449; --green-light:#EAFAF1;
    --cream:      #FAFAF8; --white:      #FFFFFF;
    --ink:        #1A1A1A; --ink-mid:    #444444; --ink-faint:  #888888;
    --border:     #E2E2DE;
    --shadow-sm:  0 1px 4px rgba(0,0,0,.06);
    --shadow-md:  0 4px 16px rgba(0,0,0,.10);
    --radius:     10px;
  }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; line-height: 1.5; }

  .app-header { background: var(--teal-deep); padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  .logo-mark { width: 38px; height: 38px; background: var(--amber); border-radius: 8px; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 14px; color: var(--teal-deep); letter-spacing: -.5px; flex-shrink: 0; }
  .app-title { color: #fff; font-size: 17px; font-weight: 600; letter-spacing: -.2px; }
  .app-sub   { color: rgba(255,255,255,.55); font-size: 12px; font-weight: 400; margin-left: auto; }

  .main { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }

  .step-label { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .step-num { width: 26px; height: 26px; background: var(--teal-deep); color: #fff; border-radius: 50%; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
  .step-text { font-size: 13px; font-weight: 600; color: var(--teal-deep); text-transform: uppercase; letter-spacing: .6px; }

  .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px; margin-bottom: 28px; }

  .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 52px 24px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; position: relative; }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--teal-mid); background: var(--teal-light); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 40px; margin-bottom: 12px; filter: grayscale(.3); }
  .upload-zone h3 { font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .upload-zone p { font-size: 13px; color: var(--ink-faint); }
  .upload-zone .file-name { margin-top: 14px; display: inline-block; background: var(--teal-light); color: var(--teal-deep); font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; }

  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media(max-width:600px) { .config-grid { grid-template-columns: 1fr; } }

  label.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-mid); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
  .field-hint { font-size: 11px; color: var(--ink-faint); margin-top: 6px; font-style: italic; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip { padding: 5px 13px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1.5px solid var(--border); background: var(--cream); cursor: pointer; transition: all .15s; user-select: none; }
  .chip.active { background: var(--teal-deep); color: #fff; border-color: var(--teal-deep); }
  .chip.amber { border-color: #e0c68a; background: #fdf8ec; color: var(--amber-deep); }
  .chip.amber.active { background: var(--amber); color: #fff; border-color: var(--amber); }
  .chip.disabled { opacity: .45; cursor: not-allowed; }

  .section-divider { border: none; border-top: 1px dashed var(--border); margin: 22px 0 18px; }
  .section-title { font-size: 14px; font-weight: 700; color: var(--amber-deep); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--amber); border-radius: 2px; }

  .btn-analyze { display: block; width: 100%; margin-top: 22px; padding: 14px; background: var(--teal-deep); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: .2px; transition: background .15s, transform .1s; }
  .btn-analyze:hover  { background: var(--teal-mid); }
  .btn-analyze:active { transform: scale(.99); }
  .btn-analyze:disabled { background: var(--border); color: var(--ink-faint); cursor: not-allowed; }

  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  @media(max-width:700px) { .summary-grid { grid-template-columns: 1fr 1fr; } }

  .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 18px; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .stat-card.teal::before  { background: var(--teal-deep); }
  .stat-card.amber::before { background: var(--amber); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.red::before   { background: var(--red); }

  .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-faint); margin-bottom: 8px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 500; color: var(--ink); line-height: 1; animation: countUp .4s ease both; }
  .stat-value.teal  { color: var(--teal-deep); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.green { color: var(--green); }
  .stat-value.red   { color: var(--red); }

  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .tab-btn { padding: 10px 20px; border: none; background: none; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink-faint); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s; }
  .tab-btn.active { color: var(--teal-deep); border-bottom-color: var(--teal-deep); font-weight: 600; }

  .search-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .search-input { flex: 1; border: 1.5px solid var(--border); border-radius: 7px; padding: 9px 13px; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: border-color .15s; }
  .search-input:focus { border-color: var(--teal-mid); }

  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { background: var(--teal-deep); color: #fff; padding: 11px 14px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: #F8FAFA; }
  tr:hover td { background: var(--teal-light); }
  td.serial { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faint); }
  td.amount { font-family: 'JetBrains Mono', monospace; text-align: right; font-weight: 500; }
  td.amount.paid { color: var(--green); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
  .badge.due  { background: var(--red-light);   color: var(--red); }
  .badge.paid { background: var(--green-light); color: var(--green); }

  .empty-state { text-align: center; padding: 40px; color: var(--ink-faint); font-size: 14px; }
  .row-count { font-size: 12px; color: var(--ink-faint); margin-left: auto; white-space: nowrap; }

  .export-bar { display: flex; gap: 12px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .btn-pdf { padding: 12px 24px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .15s, transform .1s; }
  .btn-pdf:hover  { background: #A93226; }
  .btn-pdf:active { transform: scale(.98); }
  .btn-secondary { padding: 11px 20px; background: var(--white); color: var(--teal-deep); border: 1.5px solid var(--teal-deep); border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .btn-secondary:hover { background: var(--teal-light); }

  #toast { position: fixed; bottom: 28px; right: 28px; background: var(--teal-deep); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-md); transform: translateY(80px); opacity: 0; transition: all .3s; z-index: 999; }
  #toast.show { transform: translateY(0); opacity: 1; }

  .hidden { display: none !important; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo-mark">IBC</div>
  <div><div class="app-title">Fee Analyzer</div></div>
  <div class="app-sub">Upload · Analyze · Export PDF</div>
</header>

<main class="main">

  <!-- STEP 1: UPLOAD -->
  <div class="step-label"><div class="step-num">1</div><div class="step-text">Upload Excel File</div></div>
  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <input type="file" accept=".xlsx,.xls" id="fileInput">
      <div class="upload-icon">📊</div>
      <h3>Drop your Excel file here</h3>
      <p>or click to browse — supports .xlsx and .xls</p>
      <div class="file-name hidden" id="fileName"></div>
    </div>
  </div>

  <!-- STEP 2: CONFIG -->
  <div id="configSection" class="hidden">
    <div class="step-label"><div class="step-num">2</div><div class="step-text">Configure Analysis</div></div>
    <div class="card">

      <!-- FEES CONFIG -->
      <div class="section-title">📋 Fees Collection</div>
      <div class="config-grid">
        <div>
          <label class="field-label">Months</label>
          <div class="chip-row" id="monthChips"></div>
        </div>
        <div>
          <label class="field-label">Fee Subject</label>
          <div class="chip-row" id="subjectChips"></div>
        </div>
      </div>

      <hr class="section-divider">

      <!-- MOCK CONFIG -->
      <div class="section-title">📝 Mock Collection</div>
      <div style="margin-bottom:14px;">
        <label class="field-label">Months</label>
        <div class="field-hint">✓ Uses the same months selected above for Fees.</div>
      </div>
      <div>
        <label class="field-label">Mock Subjects <span style="font-weight:400; color:var(--ink-faint);">(multi-select — toggle on/off)</span></label>
        <div class="chip-row" id="mockSubjectChips"></div>
        <div class="field-hint" id="mockHint">No mock collection blocks detected in this file.</div>
      </div>

      <button class="btn-analyze" id="analyzeBtn" disabled>Analyze Collection</button>
    </div>
  </div>

  <!-- STEP 3: RESULTS -->
  <div id="resultsSection" class="hidden">
    <div class="step-label"><div class="step-num">3</div><div class="step-text">Analysis Results</div></div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div class="card">
      <div class="tabs">
        <button class="tab-btn" id="tabDue"  onclick="switchTab('due')">⚠️ Fees Due</button>
        <button class="tab-btn active" id="tabPaid" onclick="switchTab('paid')">✓ Fees Collected</button>
        <button class="tab-btn" id="tabAll"  onclick="switchTab('all')">📋 All Students</button>
      </div>
      <div class="search-bar">
        <input class="search-input" id="searchInput" placeholder="Search by name or serial…" oninput="filterTable()">
        <span class="row-count" id="rowCount"></span>
      </div>
      <div class="table-wrap">
        <table id="mainTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state hidden" id="emptyState">No records found.</div>
      </div>
      <div class="export-bar">
        <button class="btn-pdf" onclick="exportPDF()"><span>📄</span> Export Paid List as PDF</button>
        <button class="btn-secondary" onclick="resetApp()">↩ New Analysis</button>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
// ─── STATE ──────────────────────────────────────────────────────────────
let workbook = null;
let allData  = [];    // parsed FEE rows across all selected sheets
let mockDataRaw = []; // ALL parsed MOCK rows (unfiltered by subject)
let mockTitle = '';
let selectedMonths   = new Set();
let selectedSubject  = '';
let selectedMockSubjects = new Set();
let availableMockSubjects  = [];
let currentTab = 'due';
let currentRows = [];

const SKIP_NAMES = /done|total|expenses|name|stationary|saiful|beki|rent|salary|ibc|details|amount|subtotal/i;
const KNOWN_SUBJECTS = ['MATHS','ACC','BUSINESS','ECONOMICS','ENGLISH','BENGOLI','CHEMISTRY','PHYSICS','BIOLOGY','Law','ICT'];

// ─── UPLOAD ─────────────────────────────────────────────────────────────
const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', ()=> uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  const fn = document.getElementById('fileName');
  fn.textContent = file.name; fn.classList.remove('hidden');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      workbook = XLSX.read(e.target.result, { type: 'array' });
      buildConfig();
      showToast('✅ File loaded: ' + file.name);
    } catch (err) {
      showToast('❌ Could not read file.');
    }
  };
  reader.readAsArrayBuffer(file);
}

// ─── HELPERS ────────────────────────────────────────────────────────────
const up = r => r.map(c => String(c).trim().toUpperCase());
const isEmptyRow = r => r.every(c => String(c).trim() === '');

/**
 * Scans a sheet for the Mock Collection title row + subject header.
 * Returns { titleIdx, titleText, endIdx, subjectCols: [{idx,name},...] } or null.
 */
function detectMockBlock(sheetName) {
  const ws = workbook.Sheets[sheetName];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  let mtIdx = -1, mtText = '';
  for (let i = 0; i < raw.length; i++) {
    const joined = raw[i].map(c => String(c).trim()).join(' ').replace(/\s+/g, ' ');
    if (/mock\s+collection/i.test(joined) || (/mock/i.test(joined) && joined.length < 80 && !/name|maths|total/i.test(joined))) {
      mtIdx = i; mtText = joined; break;
    }
  }
  if (mtIdx < 0) return null;

  // Skip blanks to find the subject header row
  let h = mtIdx + 1;
  while (h < raw.length && isEmptyRow(raw[h])) h++;
  if (h >= raw.length) return null;

  const mh = up(raw[h]);
  const mNameIdx   = mh.findIndex(x => x === 'NAME');
  const mSerialIdx = mh.findIndex(x => x === 'SERIAL');
  const subjectCols = [];
  mh.forEach((x, i) => {
    if (x && i !== mNameIdx && i !== mSerialIdx && !/^(SL|NO|#|DATE|TOTAL|FEE|FEES)$/.test(x)) {
      subjectCols.push({ idx: i, name: x });
    }
  });

  // Find end of mock block (blank row, or next NAME+MATHS header)
  let endIdx = raw.length;
  for (let i = h + 1; i < raw.length; i++) {
    if (isEmptyRow(raw[i])) { endIdx = i; break; }
    const r = up(raw[i]);
    if (r.includes('NAME') && r.includes('MATHS')) { endIdx = i; break; }
  }
  return { titleIdx: mtIdx, titleText: mtText, endIdx, nameIdx: mNameIdx, serialIdx: mSerialIdx, subjectCols };
}

// ─── CONFIG ─────────────────────────────────────────────────────────────
function buildConfig() {
  const sheets = workbook.SheetNames;

  // --- MONTH CHIPS ---
  const mc = document.getElementById('monthChips');
  mc.innerHTML = '';
  selectedMonths.clear();
  sheets.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'chip'; chip.textContent = s;
    chip.onclick = () => {
      chip.classList.toggle('active');
      if (chip.classList.contains('active')) selectedMonths.add(s);
      else selectedMonths.delete(s);
      updateAnalyzeBtn();
    };
    mc.appendChild(chip);
  });
  sheets.slice(-2).forEach(n => {
    [...mc.querySelectorAll('.chip')].find(c => c.textContent === n)?.classList.add('active');
    selectedMonths.add(n);
  });

  // --- FEE SUBJECT CHIPS ---
  let detectedSubjects = [];
  for (const s of sheets) {
    const ws = workbook.Sheets[s];
    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    for (const row of raw) {
      const found = KNOWN_SUBJECTS.filter(sub => up(row).includes(sub));
      if (found.length > 2) { detectedSubjects = found; break; }
    }
    if (detectedSubjects.length) break;
  }
  if (!detectedSubjects.length) detectedSubjects = KNOWN_SUBJECTS;

  const sc = document.getElementById('subjectChips');
  sc.innerHTML = '';
  detectedSubjects.forEach(sub => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (sub === 'PHYSICS' ? ' active' : '');
    chip.textContent = sub;
    chip.onclick = () => {
      sc.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      selectedSubject = sub;
      updateAnalyzeBtn();
    };
    sc.appendChild(chip);
  });
  selectedSubject = detectedSubjects.includes('PHYSICS') ? 'PHYSICS' : detectedSubjects[0] || '';

  // --- MOCK SUBJECT CHIPS (multi-select, amber-styled) ---
  const mockSubjectSet = new Set();
  let anyMock = false;
  let detectedMockTitle = '';
  sheets.forEach(s => {
    const mb = detectMockBlock(s);
    if (mb && mb.subjectCols.length) {
      anyMock = true;
      if (!detectedMockTitle) detectedMockTitle = mb.titleText;
      mb.subjectCols.forEach(c => mockSubjectSet.add(c.name));
    }
  });
  availableMockSubjects = [...mockSubjectSet];
  selectedMockSubjects = new Set(availableMockSubjects); // default: all on

  const msc = document.getElementById('mockSubjectChips');
  const mhint = document.getElementById('mockHint');
  msc.innerHTML = '';

  if (!anyMock) {
    mhint.textContent = '⚠️ No mock collection blocks detected in this file.';
    mhint.style.color = 'var(--amber-deep)';
  } else {
    mhint.textContent = `${availableMockSubjects.length} subject(s) detected. Toggle to include/exclude from the PDF.`;
    mhint.style.color = 'var(--ink-faint)';

    availableMockSubjects.forEach(sub => {
      const chip = document.createElement('div');
      chip.className = 'chip amber active';
      chip.textContent = sub;
      chip.onclick = () => {
        if (chip.classList.contains('active')) {
          chip.classList.remove('active');
          selectedMockSubjects.delete(sub);
        } else {
          chip.classList.add('active');
          selectedMockSubjects.add(sub);
        }
      };
      msc.appendChild(chip);
    });
  }

  document.getElementById('configSection').classList.remove('hidden');
  updateAnalyzeBtn();
}

function updateAnalyzeBtn() {
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = !(selectedMonths.size > 0 && selectedSubject);
}

// ─── PARSE SHEET (returns fee + mock rows) ────────────────────────────
function parseSheet(sheetName) {
  const ws  = workbook.Sheets[sheetName];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  const mb = detectMockBlock(sheetName);
  const mockRows = [];

  if (mb) {
    for (let i = mb.titleIdx + 1; i < mb.endIdx; i++) {
      if (isEmptyRow(raw[i])) continue;
      const r = raw[i];
      let name = mb.nameIdx >= 0 ? String(r[mb.nameIdx] || '').trim() : '';
      if (!name) { for (const c of r) { const s = String(c).trim(); if (s && isNaN(parseFloat(s))) { name = s; break; } } }
      if (!name || SKIP_NAMES.test(name)) continue;
      const serial = mb.serialIdx >= 0 ? String(r[mb.serialIdx] || '').trim() : '';
      mb.subjectCols.forEach(sc => {
        const amt = parseFloat(r[sc.idx]) || 0;
        if (amt > 0) {
          mockRows.push({
            serial, name, subject: sc.name, paid: amt, total: amt,
            status: 'PAID', month: sheetName, date: '', type: 'mock'
          });
        }
      });
    }
  }

  // --- Fee table: find NAME+MATHS header OUTSIDE the mock block ---
  let headerIdx = -1, headers = [];
  for (let i = 0; i < raw.length; i++) {
    if (mb && i >= mb.titleIdx && i < mb.endIdx) continue;
    const r = up(raw[i]);
    if (r.includes('NAME') && r.includes('MATHS')) { headerIdx = i; headers = raw[i].map(c => String(c).trim()); break; }
  }
  const feeRows = [];
  if (headerIdx >= 0) {
    const nameIdx    = headers.findIndex(h => h.toUpperCase() === 'NAME');
    const serialIdx  = headers.findIndex(h => h.toUpperCase() === 'SERIAL');
    const subjectIdx = headers.findIndex(h => h.toUpperCase() === selectedSubject.toUpperCase());
    const totalIdx   = headers.findIndex(h => h.toUpperCase() === 'TOTAL');
    const dateIdx    = headers.findIndex(h => h.toUpperCase() === 'DATE');

    if (subjectIdx >= 0 && nameIdx >= 0) {
      for (let i = headerIdx + 1; i < raw.length; i++) {
        if (mb && i >= mb.titleIdx && i < mb.endIdx) { if (i === mb.titleIdx) break; else continue; }
        const r = raw[i];
        const name = String(r[nameIdx] || '').trim();
        if (!name || SKIP_NAMES.test(name)) continue;
        const paid = parseFloat(r[subjectIdx]) || 0;
        const total = parseFloat(r[totalIdx]) || 0;
        feeRows.push({
          serial: String(r[serialIdx] || '').trim(),
          name, subject: selectedSubject, paid, total,
          status: paid > 0 ? 'PAID' : 'DUE',
          month: sheetName, date: String(r[dateIdx] || '').trim(),
          type: 'fee'
        });
      }
    }
  }

  return { feeRows, mockRows, mockTitle: mb?.titleText || '' };
}

// ─── ANALYZE ────────────────────────────────────────────────────────────
document.getElementById('analyzeBtn').addEventListener('click', analyze);

function analyze() {
  const btn = document.getElementById('analyzeBtn');
  btn.innerHTML = '<span class="spinner"></span> Analyzing…';
  btn.disabled = true;

  setTimeout(() => {
    allData = []; mockDataRaw = []; mockTitle = '';
    selectedMonths.forEach(m => {
      const res = parseSheet(m);
      allData  = allData.concat(res.feeRows);
      mockDataRaw = mockDataRaw.concat(res.mockRows);
      if (res.mockTitle && !mockTitle) mockTitle = res.mockTitle;
    });
    allData.sort((a, b) => a.name.localeCompare(b.name));
    mockDataRaw.sort((a, b) => a.name.localeCompare(b.name));

    renderSummary();
    switchTab('paid');
    document.getElementById('resultsSection').classList.remove('hidden');
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });

    btn.innerHTML = 'Analyze Collection';
    btn.disabled = false;
    const mockFiltered = getFilteredMockRows();
    const extra = mockFiltered.length ? ` + ${mockFiltered.length} mock payment(s)` : '';
    showToast(`✅ ${allData.length} fee students${extra} analyzed across ${selectedMonths.size} month(s)`);
  }, 200);
}

// Filter mock rows by selected months (already filtered during parse) + selected mock subjects
function getFilteredMockRows() {
  return mockDataRaw.filter(r => selectedMockSubjects.has(r.subject));
}

// ─── SUMMARY ───────────────────────────────────────────────────────────
function renderSummary() {
  const due  = allData.filter(r => r.status === 'DUE');
  const paid = allData.filter(r => r.status === 'PAID');
  const feeTotal  = paid.reduce((s, r) => s + r.paid, 0);
  const mockRows  = getFilteredMockRows();
  const mockTotal = mockRows.reduce((s, r) => s + r.paid, 0);

  const months = [...selectedMonths];
  const summaries = months.map(m => ({
    month: m,
    paid:  allData.filter(r => r.month === m && r.status === 'PAID'),
    due:   allData.filter(r => r.month === m && r.status === 'DUE'),
  }));

  let html = `
    <div class="stat-card teal">
      <div class="stat-label">Total Students</div>
      <div class="stat-value teal">${allData.length}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">${selectedSubject} Fees Collected</div>
      <div class="stat-value green">${fmtBDT(feeTotal)}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Paid Students</div>
      <div class="stat-value green">${paid.length}</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">Fees Due</div>
      <div class="stat-value red">${due.length}</div>
    </div>
  `;

  if (mockRows.length) {
    html += `
      <div class="stat-card amber">
        <div class="stat-label">Mock Collected (${selectedMockSubjects.size} subj.)</div>
        <div class="stat-value amber">${fmtBDT(mockTotal)}</div>
      </div>
    `;
  }

  if (months.length > 1) {
    summaries.forEach(s => {
      html += `
        <div class="stat-card amber" style="grid-column: span 2">
          <div class="stat-label">${s.month}</div>
          <div class="stat-value amber" style="font-size:16px">
            Paid: ${s.paid.length} &nbsp;|&nbsp; Due: ${s.due.length} &nbsp;|&nbsp; Collected: ${fmtBDT(s.paid.reduce((t,r)=>t+r.paid,0))}
          </div>
        </div>`;
    });
  }
  document.getElementById('summaryGrid').innerHTML = html;
}

// ─── TABS / TABLE ───────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  ['due','paid','all'].forEach(t => {
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1))
      .classList.toggle('active', t === tab);
  });
  document.getElementById('searchInput').value = '';
  renderTable(allData);
}

function renderTable(data) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let rows = data;
  if (currentTab === 'due')  rows = rows.filter(r => r.status === 'DUE');
  if (currentTab === 'paid') rows = rows.filter(r => r.status === 'PAID');
  if (search) rows = rows.filter(r => r.name.toLowerCase().includes(search) || r.serial.toLowerCase().includes(search));

  currentRows = rows;
  const multi = selectedMonths.size > 1;

  document.getElementById('tableHead').innerHTML = `
    <tr>
      <th>#</th><th>Serial No.</th><th>Student Name</th>
      ${multi ? '<th>Month</th>' : ''}
      <th style="text-align:right">${selectedSubject} (BDT)</th>
      <th>Status</th>
    </tr>`;

  const body = document.getElementById('tableBody');
  if (!rows.length) {
    body.innerHTML = '';
    document.getElementById('emptyState').classList.remove('hidden');
    document.getElementById('rowCount').textContent = '0 records';
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('rowCount').textContent = rows.length + ' record' + (rows.length !== 1 ? 's' : '');

  body.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="serial">${i + 1}</td>
      <td class="serial">${r.serial}</td>
      <td>${r.name}</td>
      ${multi ? `<td class="serial">${r.month}</td>` : ''}
      <td class="amount ${r.status.toLowerCase()}">${r.paid > 0 ? fmtBDT(r.paid) : '—'}</td>
      <td><span class="badge ${r.status.toLowerCase()}">${r.status}</span></td>
    </tr>`).join('');
}

function filterTable() { renderTable(allData); }

// ─── PDF EXPORT ─────────────────────────────────────────────────────────
function exportPDF() {
  const paidRows = allData.filter(r => r.status === 'PAID');
  const mockRows = getFilteredMockRows();
  if (!paidRows.length && !mockRows.length) { showToast('❌ No paid fees/mock rows to export.'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const PAGE_H = doc.internal.pageSize.height;

  const months = [...selectedMonths].join(', ');
  const today  = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  const feeTotal  = paidRows.reduce((s, r) => s + r.paid, 0);
  const mockTotal = mockRows.reduce((s, r) => s + r.paid, 0);
  const multi = selectedMonths.size > 1;
  const mockSubjList = [...selectedMockSubjects].join(', ') || '—';

  const footer = data => {
    const ph = doc.internal.pageSize.height;
    doc.setFontSize(8); doc.setTextColor(150); doc.setFont('helvetica','normal');
    doc.text('IBC Fee Analyzer  •  Confidential', 10, ph - 8);
    doc.text(`Page ${data.pageNumber}`, 200, ph - 8, { align: 'right' });
  };
  const ensureSpace = (y, need) => { if (y > PAGE_H - need) { doc.addPage(); return 20; } return y; };

  // Main header
  doc.setFillColor(13, 92, 99); doc.rect(0, 0, 210, 38, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(255,255,255);
  doc.text('IBC — Fee Collection List', 15, 16);
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text(`Fee Subject: ${selectedSubject}   |   Month(s): ${months}   |   Generated: ${today}`, 15, 25);
  if (mockRows.length) {
    doc.text(`Mock Subject(s): ${mockSubjList}`, 15, 30);
    doc.text(`Fees: BDT ${fmtBDT(feeTotal)} (${paidRows.length})   |   Mock: BDT ${fmtBDT(mockTotal)} (${mockRows.length})`, 15, 35);
  } else {
    doc.text(`Fees Collected: BDT ${fmtBDT(feeTotal)} (${paidRows.length} students)`, 15, 30);
  }
  let y = 46;

  // ═══════ SECTION 1 — FEES ═══════
  if (paidRows.length) {
    doc.setFillColor(13, 92, 99); doc.rect(10, y - 4, 190, 8, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(255,255,255);
    doc.text(`SECTION 1 — FEES COLLECTION (${selectedSubject})`, 14, y + 1);
    y += 8;

    const byMonth = {};
    paidRows.forEach(r => { (byMonth[r.month] = byMonth[r.month] || []).push(r); });

    Object.entries(byMonth).forEach(([month, rows]) => {
      const monthTotal = rows.reduce((s, r) => s + r.paid, 0);
      if (multi) {
        y = ensureSpace(y, 40);
        doc.setFillColor(230, 244, 245); doc.rect(10, y - 4, 190, 8, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(13, 92, 99);
        doc.text(`${month}  —  ${rows.length} students  |  Collected: BDT ${fmtBDT(monthTotal)}`, 14, y + 1);
        y += 8;
      }
      const tableData = rows.sort((a,b) => a.name.localeCompare(b.name))
        .map((r, i) => [i + 1, r.serial, r.name, fmtBDT(r.paid)]);

      doc.autoTable({
        startY: y,
        head: [[ '#', 'Serial No.', 'Student Name', `${selectedSubject} Paid (BDT)` ]],
        body: tableData,
        theme: 'grid', margin: { left: 10, right: 10 },
        headStyles: { fillColor: [13, 92, 99], textColor: 255, fontStyle: 'bold', fontSize: 9 },
        bodyStyles: { fontSize: 9, textColor: [26,26,26] },
        alternateRowStyles: { fillColor: [246, 251, 251] },
        columnStyles: {
          0: { cellWidth: 10, align: 'center' },
          1: { cellWidth: 30, font: 'courier' },
          2: { cellWidth: 'auto' },
          3: { cellWidth: 35, align: 'right', textColor: [30, 132, 73], fontStyle:'bold' },
        },
        foot: [['', '', 'TOTAL COLLECTED', `BDT ${fmtBDT(monthTotal)}`]],
        footStyles: { fillColor: [13, 92, 99], textColor: 255, fontStyle: 'bold', fontSize: 9, halign: 'right' },
        didDrawPage: footer,
      });
      y = doc.lastAutoTable.finalY + 10;
    });

    y = ensureSpace(y, 26);
    doc.setFillColor(13, 92, 99); doc.rect(10, y, 190, 12, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(`FEES GRAND TOTAL — ${selectedSubject}: BDT ${fmtBDT(feeTotal)}  (${paidRows.length} students)`, 15, y + 8);
    y += 12;
  }

  // ═══════ SECTION 2 — MOCK COLLECTION (only if filtered rows exist) ═══════
  if (mockRows.length) {
    doc.addPage();
    doc.setFillColor(232, 160, 32); doc.rect(0, 0, 210, 30, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(26,26,26);
    doc.text(mockTitle || 'Mock Collection', 15, 12);
    doc.setFontSize(10); doc.setFont('helvetica','normal');
    doc.text(`Month(s): ${months}   |   Subject(s): ${mockSubjList}   |   Generated: ${today}`, 15, 20);
    doc.text(`Total Mock Payments: ${mockRows.length}   |   Total Collected: BDT ${fmtBDT(mockTotal)}`, 15, 26);

    let my = 38;
    const bySubj = {};
    mockRows.forEach(r => { (bySubj[r.subject] = bySubj[r.subject] || []).push(r); });

    Object.entries(bySubj).forEach(([subj, rows]) => {
      const subjTotal = rows.reduce((s, r) => s + r.paid, 0);
      my = ensureSpace(my, 40);
      doc.setFillColor(254, 243, 220); doc.rect(10, my - 4, 190, 8, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(148, 104, 20);
      doc.text(`${subj}  —  ${rows.length} student(s)  |  Collected: BDT ${fmtBDT(subjTotal)}`, 14, my + 1);
      my += 8;

      const tableData = rows.sort((a,b) => a.name.localeCompare(b.name))
        .map((r, i) => multi ? [i + 1, r.serial, r.name, r.month, fmtBDT(r.paid)] : [i + 1, r.serial, r.name, fmtBDT(r.paid)]);

      doc.autoTable({
        startY: my,
        head: multi
          ? [[ '#', 'Serial No.', 'Student Name', 'Month', `${subj} (BDT)` ]]
          : [[ '#', 'Serial No.', 'Student Name', `${subj} (BDT)` ]],
        body: tableData,
        theme: 'grid', margin: { left: 10, right: 10 },
        headStyles: { fillColor: [232, 160, 32], textColor: 255, fontStyle: 'bold', fontSize: 9 },
        bodyStyles: { fontSize: 9, textColor: [26,26,26] },
        alternateRowStyles: { fillColor: [255, 250, 240] },
        columnStyles: multi
          ? { 0:{cellWidth:10,align:'center'}, 1:{cellWidth:28,font:'courier'}, 2:{cellWidth:'auto'}, 3:{cellWidth:22}, 4:{cellWidth:32,align:'right',textColor:[148,104,20],fontStyle:'bold'} }
          : { 0:{cellWidth:10,align:'center'}, 1:{cellWidth:30,font:'courier'}, 2:{cellWidth:'auto'}, 3:{cellWidth:35,align:'right',textColor:[148,104,20],fontStyle:'bold'} },
        foot: multi ? [['', '', '', 'TOTAL', `BDT ${fmtBDT(subjTotal)}`]] : [['', '', 'TOTAL', `BDT ${fmtBDT(subjTotal)}`]],
        footStyles: { fillColor: [232, 160, 32], textColor: 255, fontStyle: 'bold', fontSize: 9, halign: 'right' },
        didDrawPage: footer,
      });
      my = doc.lastAutoTable.finalY + 10;
    });

    my = ensureSpace(my, 26);
    doc.setFillColor(232, 160, 32); doc.rect(10, my, 190, 12, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(`MOCK GRAND TOTAL: BDT ${fmtBDT(mockTotal)}  (${mockRows.length} payments)`, 15, my + 8);
    my += 12;

    if (paidRows.length) {
      my = ensureSpace(my, 26);
      doc.setFillColor(26, 43, 76); doc.rect(10, my, 190, 12, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(`COMBINED GRAND TOTAL (Fees + Mock): BDT ${fmtBDT(feeTotal + mockTotal)}`, 15, my + 8);
    }
  }

  const safeMonth = months.replace(/[^a-z0-9]/gi, '_');
  doc.save(`IBC_${selectedSubject}_Collected_${safeMonth}.pdf`);
  showToast(`📄 PDF exported — ${paidRows.length} fee + ${mockRows.length} mock row(s)`);
}

// ─── HELPERS ────────────────────────────────────────────────────────────
function fmtBDT(n) { return Number(n).toLocaleString('en-IN'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function resetApp() {
  allData = []; mockDataRaw = []; mockTitle = '';
  selectedMonths.clear(); selectedSubject = '';
  selectedMockSubjects.clear(); availableMockSubjects = [];
  workbook = null;
  document.getElementById('resultsSection').classList.add('hidden');
  document.getElementById('configSection').classList.add('hidden');
  document.getElementById('fileName').classList.add('hidden');
  document.getElementById('fileInput').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
